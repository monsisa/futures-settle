<style>
  :root{
    --bg:#faf8f3; --surface:#ffffff; --stripe:#f5f1e8; --head:#f0ebe0;
    --ink:#1b1a16; --ink-soft:#69645a; --ink-faint:#9c9583; --line:#e6e0d2; --line-soft:#efe9dd;
    --up:#c0392b; --up-bg:rgba(192,57,43,.12); --down:#0f8a4c; --down-bg:rgba(15,138,76,.12);
    --accent:#2a5da0; --accent-bg:rgba(42,93,160,.10); --rest-bg:#eceadf;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#131209; --surface:#1b1910; --stripe:#211e14; --head:#252115;
    --ink:#f0ede3; --ink-soft:#a69e8c; --ink-faint:#726a5a; --line:#302b20; --line-soft:#28241a;
    --up:#ff6a5f; --up-bg:rgba(255,106,95,.14); --down:#3cc879; --down-bg:rgba(60,200,121,.14);
    --accent:#78ade6; --accent-bg:rgba(120,173,230,.14); --rest-bg:#242116;
  }}
  :root[data-theme="dark"]{
    --bg:#131209; --surface:#1b1910; --stripe:#211e14; --head:#252115;
    --ink:#f0ede3; --ink-soft:#a69e8c; --ink-faint:#726a5a; --line:#302b20; --line-soft:#28241a;
    --up:#ff6a5f; --up-bg:rgba(255,106,95,.14); --down:#3cc879; --down-bg:rgba(60,200,121,.14);
    --accent:#78ade6; --accent-bg:rgba(120,173,230,.14); --rest-bg:#242116;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
  .sitenav{display:flex;gap:4px;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;overflow-x:auto}
  .sitenav a{flex:none;text-decoration:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;white-space:nowrap}
  .sitenav a:hover{background:var(--stripe);color:var(--ink)}
  .sitenav a.active{background:var(--accent-bg);color:var(--accent)}
  .sitenav .navtheme{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;flex:none}
  :root[data-theme="dark"]{color-scheme:dark}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
  [data-tip]{cursor:help}
  .ttpop{position:fixed;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.55;z-index:200;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.28)}

  header.top{border-bottom:1px solid var(--line);background:var(--surface)}
  .top-in{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:19px;letter-spacing:.3px} .logo b{color:var(--accent)}
  .tag{font-size:12.5px;color:var(--ink-soft)}

  .du{font-size:12px;color:var(--ink-faint);margin-top:16px}

  /* 合計方向條 */
  .hero{margin-top:12px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .hero .top{display:flex;align-items:center;gap:14px;padding:16px 18px}
  .hero.up .top{background:var(--up-bg)} .hero.down .top{background:var(--down-bg)} .hero.rest .top{background:var(--rest-bg)}
  .hero .lab{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .hero .big{font-size:24px;font-weight:900}
  .hero.up .big{color:var(--up)} .hero.down .big{color:var(--down)}
  .hero .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink-soft)}
  .hero .note{padding:10px 18px;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line-soft);background:var(--surface)}

  h2.sec{font-size:16px;font-weight:800;margin:26px 0 4px}
  .hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 12px}

  .cards{display:grid;gap:12px}
  .inst{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .inst .ih{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .inst .nm{font-size:17px;font-weight:800}
  .pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
  .pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.rest{background:var(--rest-bg);color:var(--ink-soft)}
  .dnet{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
  .dnet b{font-weight:800}
  .inst .note{font-size:11.5px;color:var(--ink-faint);margin:-4px 0 10px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{color:var(--ink-soft);font-size:11px;font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.l{text-align:left}
  tbody td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  td.l{text-align:left;font-weight:700}
  .cc{color:var(--up)} .pp{color:var(--down)}
  .netpos{color:var(--up);font-weight:800} .netneg{color:var(--down);font-weight:800}
  .bull{color:var(--up)} .bear{color:var(--down)}

  /* 口數/金額 切換 */
  .seg{display:inline-flex;background:var(--head);border:1px solid var(--line);border-radius:9px;padding:3px;margin:2px 0 12px}
  .seg button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:7px}
  .seg button.on{background:var(--surface);color:var(--ink)}
  /* 近5日趨勢 */
  .trend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-x:auto}
  .trend table{min-width:360px}
  .trend th,.trend td{text-align:center;padding:7px 6px;font-size:12.5px}
  .trend td.l,.trend th.l{text-align:left;font-weight:700;white-space:nowrap}
  .trend thead th{font-size:11px;color:var(--ink-faint);border-bottom:1px solid var(--line)}
  .trend .cell{font-family:"JetBrains Mono",monospace;font-weight:700;border-radius:6px;padding:4px 6px;display:inline-block;min-width:50px}
  .trend .pos{background:var(--up-bg);color:var(--up)} .trend .neg{background:var(--down-bg);color:var(--down)} .trend .zero{color:var(--ink-faint)}

  .foot{margin-top:24px;font-size:12px;color:var(--ink-soft);line-height:1.75}
  .foot b{color:var(--ink)} .foot code{background:var(--head);padding:1px 6px;border-radius:5px;font-family:"JetBrains Mono",monospace;font-size:11px}
</style>

<header class="top">
  <div class="top-in">
    <span class="logo">三大法人<b>選擇權</b>未平倉</span>
    <span class="tag">台指選 自營/投信/外資 · 買賣權持倉方向</span>
  </div>
</header>

<div class="wrap">
  <div class="du" id="du"></div>
  <div class="hero" id="hero"></div>

  <h2 class="sec">近5日方向趨勢</h2>
  <p class="hint">方向淨口數(<span class="bull">偏多正</span> / <span class="bear">偏空負</span>)。看外資、投信是持續偏多還是偏空堆疊。</p>
  <div class="trend" id="trend"></div>

  <h2 class="sec">各法人未平倉</h2>
  <p class="hint">淨額 = 買方 − 賣方。<span class="bull">偏多</span> = 買買權 + 賣賣權;<span class="bear">偏空</span> = 賣買權 + 買賣權。<br>切「金額」顯示的是<b>未平倉契約市值</b>(持倉),<b>非</b>當日成交(交易)金額。</p>
  <div class="seg" id="seg"><button data-m="口" class="on">口數</button><button data-m="金">金額(萬元)</button></div>
  <div class="cards" id="cards"></div>

  <div class="foot" id="foot"></div>
</div>
<div id="tt" class="ttpop" hidden></div>

<script>
const DATA = {"meta":{"data_date":"2026-10-16","prev_date":"2026-10-15","updated":"2026-10-18 09:04","sum_dir":-17293,"sum_lab":"偏空"},"insts":[{"key":"foreign","name":"外資","note":"","call":{"b":15849,"s":15146,"net":703,"ba":559833,"sa":573845,"amt":-14012},"put":{"b":15123,"s":7803,"net":7320,"ba":838170,"sa":709347,"amt":128823},"dir_net":-6617,"dir":"偏空","dir_chg":-628},{"key":"trust","name":"投信","note":"","call":{"b":0,"s":10371,"net":-10371,"ba":0,"sa":671012,"amt":-671012},"put":{"b":305,"s":0,"net":305,"ba":849,"sa":0,"amt":849},"dir_net":-10676,"dir":"偏空","dir_chg":-1340},{"key":"dealer","name":"自營商","note":"多為選擇權造市商避險部位,方向訊號參考性低","call":{"b":37711,"s":21262,"net":16449,"ba":1048042,"sa":624657,"amt":423385},"put":{"b":17877,"s":20726,"net":-2849,"ba":522567,"sa":349396,"amt":173171},"dir_net":19298,"dir":"偏多","dir_chg":8094}],"trend":{"dates":["10/12","10/13","10/14","10/15","10/16"],"foreign":[-1526,-2113,-2006,-5989,-6617],"trust":[-8134,-8364,-4274,-9336,-10676],"sum":[-9660,-10477,-6280,-15325,-17293]}};
const M = DATA.meta, INSTS = DATA.insts;
const comma = n => Number(n).toLocaleString('en-US');
const sgn = x => (x>0?'+':(x<0?'−':''))+comma(Math.abs(x));

document.getElementById('du').textContent = `資料日 ${M.data_date}　(對比前一交易日 ${M.prev_date||'—'})`;

// 合計方向(外資+投信)
const scls = M.sum_lab==='偏多'?'up':(M.sum_lab==='偏空'?'down':'rest');
document.getElementById('hero').className = 'hero '+scls;
document.getElementById('hero').innerHTML = `
  <div class="top">
    <div><div class="lab">外資 + 投信 合計方向</div><div class="big">${M.sum_lab}</div></div>
    <div class="r">方向淨口數<br><b class="num">${sgn(M.sum_dir)}</b></div>
  </div>
  <div class="note">排除自營商(造市避險、方向性低),以外資+投信的「買Call+賣Put − 賣Call−買Put」合計估整體法人傾向。</div>`;

// 近5日方向趨勢
const T=DATA.trend||{dates:[],foreign:[],trust:[],sum:[]};
const kfmt=v=>(v>0?'+':(v<0?'−':''))+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1)+'k':Math.abs(v));
function trendRow(lab,arr){
  return `<tr><td class="l">${lab}</td>`+(arr||[]).map(v=>{
    const cl=v>500?'pos':(v<-500?'neg':'zero');
    return `<td><span class="cell ${cl}">${kfmt(v)}</span></td>`;
  }).join('')+`</tr>`;
}
document.getElementById('trend').innerHTML = `<table>
  <thead><tr><th class="l">方向淨(口)</th>${(T.dates||[]).map(d=>`<th>${d}</th>`).join('')}</tr></thead>
  <tbody>
    ${trendRow('外資',T.foreign)}
    ${trendRow('投信',T.trust)}
    ${trendRow('合計(外+投)',T.sum)}
  </tbody></table>`;

// 各法人卡(口數 / 金額 切換)
let mode='口';
const wan=x=>Math.round(x/10);   // 千元 -> 萬元
function renderCards(){
  const netcls = v => v>0?'netpos':(v<0?'netneg':'');
  const hb = mode==='口' ? ['買方未平倉(口)','賣方未平倉(口)','淨額(口)'] : ['買方(萬元)','賣方(萬元)','淨額(萬元)'];
  const row = (labcls,lab,o)=>{
    let b,ss,net;
    if(mode==='口'){ b=o.b; ss=o.s; net=o.net; } else { b=wan(o.ba); ss=wan(o.sa); net=wan(o.amt); }
    return `<tr><td class="l ${labcls}">${lab}</td><td class="num">${comma(b)}</td><td class="num">${comma(ss)}</td><td class="num ${netcls(net)}">${sgn(net)}</td></tr>`;
  };
  document.getElementById('cards').innerHTML = INSTS.map(x=>{
    const cls = x.dir==='偏多'?'up':(x.dir==='偏空'?'down':'rest');
    const chg = x.dir_chg==null ? '' : `　較前日 <b class="num ${x.dir_chg>0?'bull':(x.dir_chg<0?'bear':'')}">${sgn(x.dir_chg)}</b>`;
    return `<div class="inst">
      <div class="ih">
        <span class="nm">${x.name}</span>
        <span class="pill ${cls}">${x.dir}</span>
        <span class="dnet">方向淨 <b class="num ${x.dir_net>0?'bull':(x.dir_net<0?'bear':'')}">${sgn(x.dir_net)}</b> 口${chg}</span>
      </div>
      ${x.note?`<div class="note">※ ${x.note}</div>`:''}
      <table>
        <thead><tr><th class="l">　</th><th>${hb[0]}</th><th>${hb[1]}</th><th>${hb[2]}</th></tr></thead>
        <tbody>${row('cc','買權 Call',x.call)}${row('pp','賣權 Put',x.put)}</tbody>
      </table>
    </div>`;
  }).join('');
}
renderCards();
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.m;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  renderCards();
});

document.getElementById('foot').innerHTML =
  `<b>資料</b> = TAIFEX「三大法人－選擇權買賣權分計」臺指選擇權(TXO)之<b>未平倉餘額</b>,資料日 ${M.data_date}。<br>`+
  `<b>買方未平倉</b> = 該法人持有的多頭部位(買進且未平倉);<b>賣方未平倉</b> = 持有的空頭部位。淨額 = 買 − 賣。<br>`+
  `<b>方向</b>:買進買權 / 賣出賣權 = 看漲動作(偏多);賣出買權 / 買進賣權 = 看跌動作(偏空)。方向淨口數 = (買權淨) − (賣權淨)。<br>`+
  `<b>自營商</b>多為選擇權造市商的避險部位,方向性低,解讀以<b>外資、投信</b>為主。OI 不分真實多空意圖,僅供大概參考。重跑 <code>三大法人選擇權_抓取.py</code> 更新。更新於 ${M.updated}。`;

// theme + tooltip
const tb=document.getElementById('theme');
try{const t=localStorage.getItem('inst-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
tb.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const nx=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('inst-theme',nx);}catch(e){}});
const tt=document.getElementById('tt');
function showTip(el){tt.textContent=el.getAttribute('data-tip');tt.hidden=false;
  const r=el.getBoundingClientRect(),tw=tt.offsetWidth,th=tt.offsetHeight;
  let left=Math.max(8,Math.min(r.right-tw,window.innerWidth-tw-8));let top=r.bottom+6;
  if(top+th>window.innerHeight-8)top=r.top-th-6; tt.style.left=left+'px';tt.style.top=Math.max(8,top)+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tt.hidden=true;});
</script>
