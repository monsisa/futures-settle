<style>

    --bg:#faf8f3; --surface:#ffffff; --stripe:#f5f1e8; --head:#f0ebe0;
    --ink:#1b1a16; --ink-soft:#69645a; --ink-faint:#9c9583; --line:#e6e0d2; --line-soft:#efe9dd;

  :root[data-theme="dark"]{

    --ink:#f0ede3; --ink-soft:#a69e8c; --ink-faint:#726a5a; --line:#302b20; --line-soft:#28241a;

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}

  .hero.down2 .top,.hero.down .top{background:var(--down-bg)} .hero.down2 .big,.hero.down .big{color:var(--down)}
  .meter{display:flex;gap:4px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line-soft)}

  .dnet{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}

  table{width:100%;border-collapse:collapse;font-size:13px}

  .trend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-x:auto}
  .trend table{min-width:360px}
  .trend th,.trend td{text-align:center;padding:7px 6px;font-size:12.5px}

  .trendwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

  .foot{margin-top:24px;font-size:12px;color:var(--ink-soft);line-height:1.75}
  .foot b{color:var(--ink)} .foot code{background:var(--head);padding:1px 6px;border-radius:5px;font-family:"JetBrains Mono",monospace;font-size:11px}
</style>

<script>
const DATA = {"meta":{"data_date":"2026-10-16","prev_date":"2026-10-15","updated":"2026-10-18 09:30","level":"偏空","z":-0.61,"pct":27,"bw":-8436,"win_n":120,"sum_dir":-17293,"sum_lab":"偏空"},"insts":[{"key":"foreign","name":"外資","note":"","call":{"b":15849,"s":15146,"net":703,"ba":559833,"sa":573845,"amt":-14012},"put":{"b":15123,"s":7803,"net":7320,"ba":838170,"sa":709347,"amt":128823},"dir_net":-6617,"dir":"偏空","dir_chg":-628},{"key":"trust","name":"投信","note":"","call":{"b":0,"s":10371,"net":-10371,"ba":0,"sa":671012,"amt":-671012},"put":{"b":305,"s":0,"net":305,"ba":849,"sa":0,"amt":849},"dir_net":-10676,"dir":"偏空","dir_chg":-1340},{"key":"dealer","name":"自營商","note":"多為選擇權造市商避險部位,方向訊號參考性低","call":{"b":37711,"s":21262,"net":16449,"ba":1048042,"sa":624657,"amt":423385},"put":{"b":17877,"s":20726,"net":-2849,"ba":522567,"sa":349396,"amt":173171},"dir_net":19298,"dir":"偏多","dir_chg":8094}],"trend":{"dates":["10/12","10/13","10/14","10/15","10/16"],"foreign":[-1526,-2113,-2006,-5989,-6617],"trust":[-8134,-8364,-4274,-9336,-10676],"dealer":[3810,9384,10767,11204,19298],"sum":[-9660,-10477,-6280,-15325,-17293],"bw":[-2919,-3084,-714,-6332,-8436]}};
const M = DATA.meta, INSTS = DATA.insts;
const comma = n => Number(n).toLocaleString('en-US');
const sgn = x => (x>0?'+':(x<0?'−':''))+comma(Math.abs(x));

document.getElementById('du').textContent = `資料日 ${M.data_date}　(對比前一交易日 ${M.prev_date||'—'})`;

// 合計方向 5 級量表(外資+投信,買方加權,近N日自我校準)
const LV=['強力偏空','偏空','中性','偏多','強力偏多'];
const LC={'強力偏空':'down2','偏空':'down','中性':'rest','偏多':'up','強力偏多':'up2'};
const hcls = M.level.includes('多')?'up':(M.level.includes('空')?'down':'rest');
document.getElementById('hero').className = 'hero '+hcls;
document.getElementById('hero').innerHTML = `
  <div class="top">
    <div><div class="lab">三大法人(外資+投信)方向</div><div class="big">${M.level}</div></div>
    <div class="r">買方加權分 <b class="num">${sgn(M.bw)}</b><br>近${M.win_n}日 z=${M.z} · 第${M.pct}百分位</div>
  </div>
  <div class="meter">${LV.map(lv=>`<span class="mseg ${LC[lv]} ${lv===M.level?'on':''}">${lv}</span>`).join('')}</div>
  <div class="note">分數 = (買Call−買Put) + 0.5×(賣Put−賣Call),外資+投信加總;等級 = 相對<b>近${M.win_n}交易日</b>的 z 分數(自我校準)。看不到價內外,為<b>相對情緒傾向</b>、非精準力道;自營商(造市避險)已排除。</div>`;

// 近5日方向趨勢
const T=DATA.trend||{dates:[],foreign:[],trust:[],sum:[]};
const kfmt=v=>(v>0?'+':(v<0?'−':''))+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1)+'k':Math.abs(v));
function trendRow(lab,arr){
  return `<tr><td class="l">${lab}</td>`+(arr||[]).map(v=>{
    const cl=v>500?'pos':(v<-500?'neg':'zero');
    return `<td><span class="cell ${cl}">${kfmt(v)}</span></td>`;
  }).join('')+`</tr>`;
}
function sparkline(T){
  const W=330,H=150,pl=10,pr=10,pt=14,pb=20;
  // [名稱, 資料, 顏色, 線寬, 透明度, 點半徑];合計最粗最明顯,其餘細淡
  const series=[
    ['外資',   T.foreign||[], '#e0883a', 1.4, 0.72, 1.8],
    ['投信',   T.trust||[],   '#9b7cd4', 1.4, 0.72, 1.8],
    ['自營商', T.dealer||[],  '#8a93a0', 1.4, 0.72, 1.8],
    ['合計(外+投)', T.sum||[], 'var(--accent)', 3, 1, 3],   // 最後畫,蓋在最上層
  ];
  const all=[].concat(T.sum||[],T.foreign||[],T.trust||[],T.dealer||[],[0]);
  let mn=Math.min(...all), mx=Math.max(...all); if(mn===mx){mn-=1;mx+=1;}
  const n=(T.dates||[]).length||1;
  const X=i=> pl+(W-pl-pr)*(n>1?i/(n-1):0.5);
  const Y=v=> pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const y0=Y(0);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">`;
  svg+=`<line x1="${pl}" y1="${y0}" x2="${W-pr}" y2="${y0}" style="stroke:var(--line);stroke-width:1;stroke-dasharray:3 3"/>`;
  svg+=`<text x="${pl}" y="${y0-3}" font-size="8" style="fill:var(--ink-faint)">0</text>`;
  (T.dates||[]).forEach((d,i)=>{ svg+=`<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" style="fill:var(--ink-faint)">${d}</text>`; });
  series.forEach(([name,arr,col,w,op,r])=>{
    const pts=arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    svg+=`<polyline points="${pts}" style="fill:none;stroke:${col};stroke-width:${w};opacity:${op};stroke-linejoin:round;stroke-linecap:round"/>`;
    arr.forEach((v,i)=>{ svg+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${r}" style="fill:${col};opacity:${op}"/>`; });
  });
  svg+=`</svg>`;
  const leg=[['合計(外+投)','var(--accent)'],['外資','#e0883a'],['投信','#9b7cd4'],['自營商','#8a93a0']];
  const legend=`<div class="tlegend">`+leg.map(([name,col])=>`<span><i style="border-top-color:${col}"></i>${name}</span>`).join('')+`</div>`;
  return svg+legend;
}
document.getElementById('trend').innerHTML = `<div class="trendwrap">
  <div class="trendchart">${sparkline(T)}</div>
  <div class="trendtable"><table>
    <thead><tr><th class="l">方向淨(口)</th>${(T.dates||[]).map(d=>`<th>${d}</th>`).join('')}</tr></thead>
    <tbody>
      ${trendRow('外資',T.foreign)}
      ${trendRow('投信',T.trust)}
      ${trendRow('自營商',T.dealer)}
      ${trendRow('合計(外+投)',T.sum)}
    </tbody></table>
  </div>
</div>`;

// 各法人卡(口數 / 金額 切換)
let mode='口';
const wan=x=>Math.round(x/10);   // 千元 -> 萬元
function renderCards(){
  const netcls = v => v>0?'netpos':(v<0?'netneg':'');
  const hb = mode==='口' ? ['買方未平倉(口)','賣方未平倉(口)','淨額(口)'] : ['買方(萬元)','賣方(萬元)','淨額(萬元)'];
  const row = (labcls,lab,o)=>{
    let b,ss,net;
    if(mode==='口'){ b=o.b; ss=o.s; net=o.net; } else { b=wan(o.ba); ss=wan(o.sa); net=wan(o.amt); }
    return `<tr><td class="l ${labcls}">${lab}</td><td class="num">${comma(b)}</td><td class="num">${comma(ss)}</td><td class="num ${netcls(net)}">${sgn(net)}</td></tr>`;
  };
  document.getElementById('cards').innerHTML = INSTS.map(x=>{
    const cls = x.dir==='偏多'?'up':(x.dir==='偏空'?'down':'rest');
    const chg = x.dir_chg==null ? '' : `　較前日 <b class="num ${x.dir_chg>0?'bull':(x.dir_chg<0?'bear':'')}">${sgn(x.dir_chg)}</b>`;
    return `<div class="inst">
      <div class="ih">
        <span class="nm">${x.name}</span>
        <span class="pill ${cls}">${x.dir}</span>
        <span class="dnet">方向淨 <b class="num ${x.dir_net>0?'bull':(x.dir_net<0?'bear':'')}">${sgn(x.dir_net)}</b> 口${chg}</span>
      </div>
      ${x.note?`<div class="note">※ ${x.note}</div>`:''}
      <table>
        <thead><tr><th class="l">　</th><th>${hb[0]}</th><th>${hb[1]}</th><th>${hb[2]}</th></tr></thead>
        <tbody>${row('cc','買權 Call',x.call)}${row('pp','賣權 Put',x.put)}</tbody>
      </table>
    </div>`;
  }).join('');
}
renderCards();
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.m;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  renderCards();
});

document.getElementById('foot').innerHTML =
  `<b>資料</b> = TAIFEX「三大法人－選擇權買賣權分計」臺指選擇權(TXO)之<b>未平倉餘額</b>,資料日 ${M.data_date}。<br>`+
  `<b>買方未平倉</b> = 該法人持有的多頭部位(買進且未平倉);<b>賣方未平倉</b> = 持有的空頭部位。淨額 = 買 − 賣。<br>`+
  `<b>方向</b>:買進買權 / 賣出賣權 = 看漲動作(偏多);賣出買權 / 買進賣權 = 看跌動作(偏空)。方向淨口數 = (買權淨) − (賣權淨)。<br>`+
  `<b>自營商</b>多為選擇權造市商的避險部位,方向性低,解讀以<b>外資、投信</b>為主。OI 不分真實多空意圖,僅供大概參考。重跑 <code>三大法人選擇權_抓取.py</code> 更新。更新於 ${M.updated}。`;

// theme + tooltip
const tb=document.getElementById('theme');
try{const t=localStorage.getItem('inst-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
tb.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const nx=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('inst-theme',nx);}catch(e){}});
const tt=document.getElementById('tt');
function showTip(el){tt.textContent=el.getAttribute('data-tip');tt.hidden=false;
  const r=el.getBoundingClientRect(),tw=tt.offsetWidth,th=tt.offsetHeight;
  let left=Math.max(8,Math.min(r.right-tw,window.innerWidth-tw-8));let top=r.bottom+6;
  if(top+th>window.innerHeight-8)top=r.top-th-6; tt.style.left=left+'px';tt.style.top=Math.max(8,top)+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tt.hidden=true;});
</script>
