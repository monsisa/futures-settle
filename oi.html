  document.getElementById('summary').innerHTML = `
    <div class="stat spot"><div class="k">現價(加權指數)</div><div class="v num">${M.spot?comma(M.spot):'—'}</div></div>
    <div class="stat"><div class="k">到期日</div><div class="v num" style="font-size:16px">${e.expiry||'—'}</div></div>
    <div class="stat put"><div class="k">支撐(Put最大)</div><div class="v num">${comma(e.put_max.strike)}<small> ${comma(e.put_max.oi)}口</small></div></div>
    <div class="stat call"><div class="k">壓力(Call最大)</div><div class="v num">${comma(e.call_max.strike)}<small> ${comma(e.call_max.oi)}口</small></div></div>
    <div class="stat"><div class="k">最大痛點</div><div class="v num">${comma(e.maxpain)}</div></div>
    <div class="stat"><div class="k">單邊總口(Call/Put)</div><div class="v num" style="font-size:15px"><span class="cc">${comma(e.total_c)}</span>/<span class="pp">${comma(e.total_p)}</span></div></div>
    <div class="stat"><div class="k">P/C 比</div><div class="v num">${(pc*100).toFixed(0)}%</div></div>`;

  // 新倉焦點(未平倉增減 vs 前一交易日)
  const cu=e.call_up, pu=e.put_up, dtc=e.d_total_c||0, dtp=e.d_total_p||0;
  document.getElementById('focus-hint').textContent = M.prev_date
    ? `本日各履約價未平倉 相對前一交易日(${M.prev_date})的增減。增倉集中處 ≈ 大戶(多為賣方)新防守位置。`
    : `尚無前一交易日資料可比較。`;
  const topList = arr => (arr&&arr.length>1) ? '其他:'+arr.slice(1,4).map(t=>`${comma(t.strike)} +${comma(t.d)}`).join(' · ') : '';
  const net = dtp - dtc, tot = Math.abs(dtc)+Math.abs(dtp), ratio = tot? net/tot : 0;
  let dir='中性(增倉分歧)', dcls='';
  if(ratio>0.15){ dir='偏多 — 支撐(Put)增倉為主'; dcls='up'; }
  else if(ratio<-0.15){ dir='偏空 — 壓力(Call)增倉為主'; dcls='down'; }
  document.getElementById('focus').innerHTML = `
    <div class="fgrid">
      <div class="fitem call">
        <div class="fk">Call 新倉最多 → 上方壓力</div>
        <div class="fv">${cu?comma(cu.strike):'—'} <span class="fd">${cu?'+'+comma(cu.d)+'口':''}</span></div>
        <div class="fsub">當日 Call 淨增 <b class="num">${dfmt(dtc)||'0'}</b> 口</div>
        <div class="ftop">${topList(e.top_c)}</div>
      </div>
      <div class="fitem put">
        <div class="fk">Put 新倉最多 → 下方支撐</div>
        <div class="fv">${pu?comma(pu.strike):'—'} <span class="fd">${pu?'+'+comma(pu.d)+'口':''}</span></div>
        <div class="fsub">當日 Put 淨增 <b class="num">${dfmt(dtp)||'0'}</b> 口</div>
        <div class="ftop">${topList(e.top_p)}</div>
      </div>
    </div>
    <div class="fdir ${dcls}">推估賣方方向:<b>${dir}</b><span class="fnote">(ΔPut ${dfmt(dtp)||'0'} − ΔCall ${dfmt(dtc)||'0'} = ${dfmt(net)||'0'})</span></div>`;

  // 分布圖(高履約價在上)
  const bk = e.buckets.slice().sort((a,b)=>b.lo-a.lo);
  const maxOI = Math.max(1, ...e.buckets.map(x=>Math.max(x.c,x.p)));
  const spotBucket = M.spot!=null ? Math.floor(M.spot/M.bucket)*M.bucket : null;
  document.getElementById('profile').innerHTML = bk.map(b=>{
    const isSup = b.lo===Math.floor(e.put_max.strike/M.bucket)*M.bucket;
    const isRes = b.lo===Math.floor(e.call_max.strike/M.bucket)*M.bucket;
    const isSpot = b.lo===spotBucket;
    const cls=['prow', isSpot?'spot':'', isSup?'sup':'', isRes?'res':''].filter(Boolean).join(' ');
    const cw=(b.c/maxOI*100), pw=(b.p/maxOI*100);
    return `<div class="${cls}">
      <div class="pbar call">${b.c?`<span class="n">${comma(b.c)}</span>`:''}<div class="b" style="width:${cw}%"></div></div>
      <div class="strike">${b.lo/1000}k${isSup?'<span class="tagm">支撐</span>':isRes?'<span class="tagm">壓力</span>':isSpot?'<span class="tagm" style="color:var(--accent)">現價</span>':''}</div>
      <div class="pbar put"><div class="b" style="width:${pw}%"></div>${b.p?`<span class="n">${comma(b.p)}</span>`:''}</div>
    </div>`;
  }).join('');

  // 數據表(高→低)
  document.getElementById('tbl-hint').textContent =
    `單邊總口數:Call ${comma(e.total_c)} / Put ${comma(e.total_p)};% 為各500點佔該邊總口數比例;ΔCall/ΔPut = 相對前一交易日(${M.prev_date||'—'})增減。`;
  document.getElementById('tbl-body').innerHTML = bk.map(b=>{
    const isSpot = b.lo===spotBucket;
    return `<tr class="${isSpot?'spotrow':''}">
      <td class="l num">${comma(b.lo)}–${comma(b.lo+M.bucket)}</td>
      <td class="num cc">${b.c?comma(b.c):''}</td>
      <td class="num dcell ${b.dc>0?'cc':(b.dc<0?'dec':'')}">${dfmt(b.dc)}</td>
      <td class="num cc">${b.c?b.cp+'%':''}</td>
      <td class="num pp">${b.p?comma(b.p):''}</td>
      <td class="num dcell ${b.dp>0?'pp':(b.dp<0?'dec':'')}">${dfmt(b.dp)}</td>
      <td class="num pp">${b.p?b.pp+'%':''}</td>
    </tr>`;
  }).join('');
}
render(defIdx);

document.getElementById('foot').innerHTML =
  `<b>資料</b> = 台指選(TXO)各履約價「未沖銷契約數(未平倉)」,一般盤,資料日 ${M.data_date}。<br>`+
  `<b>支撐</b> = Put 未平倉最大的履約價(下方大戶防守);<b>壓力</b> = Call 未平倉最大的履約價(上方大戶防守)。<br>`+
  `<b>最大痛點(Max Pain)</b> = 讓買方選擇權總價值最小(賣方最有利)的結算價,常被視為大戶想結算的位置。<br>`+
  `<b>新倉焦點(ΔOI)</b> = 本日未平倉 − 前一交易日(${M.prev_date||'—'})。增倉最多的履約價,推測是大戶(多為賣方)新增的防守位置:Call 增倉 → 壓力、Put 增倉 → 支撐。方向為「ΔPut 總量 vs ΔCall 總量」的粗估,僅供參考,OI 不分買賣方發起,非絕對。<br>`+
  `<b>每500點比例</b> = 該價格帶未平倉 ÷ 該邊(Call或Put)總未平倉。重跑 <code>選擇權未平倉分布_抓取.py</code> 更新。更新於 ${M.updated}。`;

// theme + tooltip
const tb=document.getElementById('theme');
try{const t=localStorage.getItem('oi-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
tb.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const nx=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('oi-theme',nx);}catch(e){}});
const tt=document.getElementById('tt');
function showTip(el){tt.textContent=el.getAttribute('data-tip');tt.hidden=false;
  const r=el.getBoundingClientRect(),tw=tt.offsetWidth,th=tt.offsetHeight;
  let left=Math.max(8,Math.min(r.right-tw,window.innerWidth-tw-8));let top=r.bottom+6;
  if(top+th>window.innerHeight-8)top=r.top-th-6; tt.style.left=left+'px';tt.style.top=Math.max(8,top)+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tt.hidden=true;});
</script>
